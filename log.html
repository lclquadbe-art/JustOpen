<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity 모델 데이터 뷰어</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .upload-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        #jsonInput {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 15px;
        }

        .file-input-wrapper {
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-label:hover {
            background: #5568d3;
        }

        button {
            padding: 12px 40px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #653a8a;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: top;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        tr:nth-child(even):hover {
            background-color: #f0f0f0;
        }

        .model-name-cell {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .list-item {
            padding: 5px 10px;
            margin: 3px 0;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            display: block;
        }

        .error-list-item {
            background: #ffe6e6;
            border-left: 3px solid #dc3545;
            color: #dc3545;
        }



        .count-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .error-badge-inline {
            background: #dc3545;
        }

        .empty-cell {
            color: #999;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .error-badge {
            background: #dc3545;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            padding: 10px;
        }

        #results {
            display: none;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .summary h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .summary-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-item .number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .summary-item .label {
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Unity 모델 데이터 뷰어</h1>
        
        <div class="upload-section">
            <h2>JSON 데이터 입력</h2>
            <textarea id="jsonInput" placeholder='{"modelDataList": [...]} 형식의 JSON을 붙여넣거나, 파일을 업로드하세요'></textarea>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept="*">
                <label for="fileInput" class="file-label">📁 JSON 파일 선택</label>
                <span id="fileName" style="margin-left: 15px; color: #666;"></span>
            </div>
            <button onclick="parseJSON()">🔍 데이터 분석</button>
        </div>

        <div id="searchSection" style="display: none;">
            <div class="upload-section">
                <h2>🔎 모델 검색 및 필터</h2>
                <input type="text" id="searchInput" placeholder="모델명을 입력하세요" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 10px;">
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button onclick="searchModels()">🔍 검색</button>
                    <button onclick="showErrorModels()" style="background: #dc3545;">⚠️ 에러 모델만 보기</button>
                    <button onclick="resetSearch()" style="background: #6c757d;">🔄 전체 보기</button>
                </div>
                <div id="searchInfo" style="margin-top: 15px; color: #666; text-align: center;"></div>
            </div>
        </div>

        <div id="results">
            <div class="summary" id="summary"></div>
            <div id="modelContainer"></div>
        </div>
    </div>

    <script>
        let allModelsData = []; // 전체 모델 데이터 저장

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('jsonInput').value = event.target.result;
                };
                reader.readAsText(file);
            }
        });

        function parseJSON() {
            const input = document.getElementById('jsonInput').value;
            
            if (!input.trim()) {
                alert('JSON 데이터를 입력해주세요!');
                return;
            }

            try {
                const data = JSON.parse(input);
                
                if (!data.modelDataList || !Array.isArray(data.modelDataList)) {
                    alert('올바른 형식이 아닙니다. modelDataList 배열이 필요합니다.');
                    return;
                }

                displayData(data.modelDataList);
            } catch (error) {
                alert('JSON 파싱 오류: ' + error.message);
            }
        }

        function displayData(models, keepOriginalData = false) {
            if (!keepOriginalData) {
                allModelsData = models; // 전체 데이터 저장
            }
            
            const container = document.getElementById('modelContainer');
            const summaryDiv = document.getElementById('summary');
            container.innerHTML = '';

            // 검색 섹션 표시
            document.getElementById('searchSection').style.display = 'block';

            // 요약 정보 생성
            let totalErrors = 0;
            models.forEach(model => {
                totalErrors += model.errorLog.length;
            });

            summaryDiv.innerHTML = `
                <h2>📊 요약 정보</h2>
                <div class="summary-grid">
                    <div class="summary-item">
                        <span class="number">${models.length}</span>
                        <span class="label">총 모델 수</span>
                    </div>
                    <div class="summary-item">
                        <span class="number">${totalErrors}</span>
                        <span class="label">총 에러 수</span>
                    </div>
                    <div class="summary-item">
                        <span class="number">${models.filter(m => m.errorLog.length > 0).length}</span>
                        <span class="label">에러가 있는 모델</span>
                    </div>
                </div>
            `;

            // 테이블 생성
            const tableDiv = document.createElement('div');
            tableDiv.className = 'table-container';
            
            let tableHTML = `
                <h2>📋 모델 상세 정보</h2>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 15%;">모델명</th>
                            <th style="width: 15%;">렌더링 객체</th>
                            <th style="width: 20%;">스케일 정보</th>
                            <th style="width: 15%;">애니메이션</th>
                            <th style="width: 10%;">포인트</th>
                            <th style="width: 25%;">에러 로그</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            models.forEach((model, index) => {
                const errorCount = model.errorLog.length;
                const errorBadge = errorCount > 0 
                    ? `<span class="count-badge error-badge-inline">⚠️ ${errorCount}</span>` 
                    : `<span class="count-badge">✅</span>`;

                tableHTML += `
                    <tr>
                        <td class="model-name-cell">
                            ${escapeHtml(model.modelName)}
                            ${errorBadge}
                        </td>
                        <td>${createListCell(model.childRenderNameArr, 'render-' + index)}</td>
                        <td>${createListCell(model.childScaleArr, 'scale-' + index)}</td>
                        <td>${createListCell(model.animClipArr, 'anim-' + index)}</td>
                        <td>${createListCell(model.pointNameArr, 'point-' + index)}</td>
                        <td>${createListCell(model.errorLog, 'error-' + index, true)}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            tableDiv.innerHTML = tableHTML;
            container.appendChild(tableDiv);

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function searchModels() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!searchTerm) {
                alert('검색어를 입력해주세요!');
                return;
            }

            const filteredModels = allModelsData.filter(model => 
                model.modelName.toLowerCase().includes(searchTerm)
            );

            if (filteredModels.length === 0) {
                document.getElementById('searchInfo').innerHTML = 
                    `<span style="color: #dc3545;">⚠️ "${searchTerm}"에 해당하는 모델을 찾을 수 없습니다.</span>`;
                return;
            }

            document.getElementById('searchInfo').innerHTML = 
                `<span style="color: #28a745;">✅ "${searchTerm}"로 검색한 결과: ${filteredModels.length}개 모델</span>`;

            displayData(filteredModels, true);
        }

        function showErrorModels() {
            const errorModels = allModelsData.filter(model => 
                model.errorLog.length > 0
            );

            if (errorModels.length === 0) {
                document.getElementById('searchInfo').innerHTML = 
                    `<span style="color: #28a745;">✅ 에러가 있는 모델이 없습니다!</span>`;
                displayData([], true);
                return;
            }

            document.getElementById('searchInfo').innerHTML = 
                `<span style="color: #dc3545;">⚠️ 에러가 있는 모델: ${errorModels.length}개</span>`;

            displayData(errorModels, true);
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInfo').innerHTML = '';
            displayData(allModelsData, true);
        }

        // Enter 키로 검색
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchModels();
                }
            });
        });

        function createListCell(items, id, isError = false) {
            if (items.length === 0) {
                return `<span class="empty-cell">-</span>`;
            }

            const itemClass = isError ? 'list-item error-list-item' : 'list-item';
            const countBadge = `<span class="count-badge ${isError ? 'error-badge-inline' : ''}">${items.length}개</span>`;
            
            let html = `<div>${countBadge}</div>`;
            
            items.forEach(item => {
                html += `<span class="${itemClass}">${escapeHtml(item)}</span>`;
            });
            
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 샘플 데이터 자동 로드 (테스트용)
        const sampleData = {
            
        };


// LocalStorage에서 로드하는 코드
window.addEventListener('DOMContentLoaded', function() {
    let jsonLoaded = false;

    // URL 파라미터에서 로드
    const urlParams = new URLSearchParams(window.location.search);
    const jsonData = urlParams.get('data');
    
    if (jsonData) {
        try {
            const decodedData = decodeURIComponent(jsonData);
            const parsedData = JSON.parse(decodedData);
            
            document.getElementById('jsonInput').value = JSON.stringify(parsedData, null, 2);
            parseJSON();
            jsonLoaded = true;
        } catch (error) {
            console.error('URL 파라미터 파싱 오류:', error);
        }
    }

    // 이 부분이 중요! LocalStorage에서 로드
    if (!jsonLoaded) {
   const storedData = localStorage.getItem('modelJsonData');
if (storedData) {
    try {
        const parsedData = JSON.parse(storedData); // ⭐ 이미 JSON.parse 한 번 해야 함
        document.getElementById('jsonInput').value = JSON.stringify(parsedData, null, 2);
        parseJSON();
    } catch (error) {
        console.error('LocalStorage 데이터 파싱 오류:', error);
    }
}
    }
});
        
        // 페이지 로드시 샘플 데이터 자동 입력
        document.getElementById('jsonInput').value = JSON.stringify(sampleData, null, 2);
    </script>
</body>
</html>
